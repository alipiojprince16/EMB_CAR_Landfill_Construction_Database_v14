function newLocalId(prefix){
 let part='';
 if(typeof crypto!=='undefined'&&crypto.getRandomValues){const bytes=new Uint8Array(16);crypto.getRandomValues(bytes);part=Array.from(bytes,b=>b.toString(16).padStart(2,'0')).join('')}
 else part=Date.now().toString(36)+Math.random().toString(36).slice(2)+Math.random().toString(36).slice(2);
 return prefix+part;
}
function normName(s){return String(s||'').trim().replace(/\s+/g,' ').toLowerCase()}
function normalizeState(){
 if(!state||!Array.isArray(state.landfills)||!Array.isArray(state.visits)||!Array.isArray(state.components))state=structuredClone(SEED);
 if(!Array.isArray(state.catalog))state.catalog=[];
 let names=new Set();
 for(const entry of [...DEFAULT_CATALOG,...state.catalog,...state.components]){
  if(!entry.name)continue;
  const k=normName(entry.name);
  if(!names.has(k)){names.add(k);if(!state.catalog.some(x=>normName(x.name)===k))state.catalog.push({name:entry.name,group:entry.group||'Other'})}
 }
 for(const c of state.components){
  if(typeof c.applicable!=='boolean')c.applicable=(c.status!=='Not Applicable');
  if(typeof c.required!=='boolean')c.required=String(c.required).toLowerCase()==='true';
 }
 if(!state.settings)state.settings={};
 if(!Array.isArray(state.photos))state.photos=[];
 // Personnel directory is part of the saved database. Old records without personnel IDs remain valid.
 if(!Array.isArray(state.personnel))state.personnel=[];
 state.personnel=state.personnel.filter(p=>p&&typeof p.id==='string'&&p.id).map(p=>({
  id:p.id,name:String(p.name||'').trim(),initials:String(p.initials||'').trim().toUpperCase(),active:p.active!==false
 }));
 for(const v of state.visits){if(v.personnelIds&&!Array.isArray(v.personnelIds))v.personnelIds=[]}
 // The EMB-CAR logo is fixed to the original official image embedded in this file.
 delete state.settings.logoData;
 state.version=12;
 initializeComponentBaselines();
}
// Preserve pre-monitoring component states so a corrected or deleted visit can be replayed safely.
// Older backups did not store a baseline. Infer status from the earliest recorded change;
// historical metadata that cannot be reliably reconstructed is left blank rather than guessed.
function visitAscending(e){return state.visits.filter(v=>v.ecc===e).sort((a,b)=>(a.date||'').localeCompare(b.date||'')||(a.createdAt||'').localeCompare(b.createdAt||'')||String(a.id||'').localeCompare(String(b.id||'')))}
function updateMatchesComponent(u,c){return (u.componentId&&u.componentId===c.id)||(!u.componentId&&normName(u.name)===normName(c.name))}
function initializeComponentBaselines(){
 for(const c of state.components){
  if(c.baseline&&typeof c.baseline==='object')continue;
  const earliest=visitAscending(c.ecc).flatMap(v=>(v.updates||[]).map(u=>({u,v}))).find(x=>updateMatchesComponent(x.u,c));
  c.baseline=earliest?{status:earliest.u.before||'Not Verified',completedDate:'',verifiedDate:'',observation:'',iis:'',verifier:''}
    :{status:c.status||'Not Verified',completedDate:c.completedDate||'',verifiedDate:c.verifiedDate||'',observation:c.observation||'',iis:c.iis||'',verifier:c.verifier||''};
 }
}
function rebuildComponentStatuses(e){
 const siteComponents=cs(e);
 for(const c of siteComponents){
  const baseline=c.baseline||{status:'Not Verified'};
  for(const key of ['status','completedDate','verifiedDate','observation','iis','verifier'])c[key]=baseline[key]|| (key==='status'?'Not Verified':'');
 }
 for(const v of visitAscending(e)){
  for(const u of v.updates||[]){
   const c=siteComponents.find(x=>updateMatchesComponent(u,x));
   if(!c||!u.after)continue;
   u.componentId=c.id;
   u.name=c.name;
   u.before=c.status;
   const prevStatus=c.status;
   c.status=u.after;c.verifiedDate=v.date||'';c.verifier=v.team||'';c.iis=v.iis||'';
   if(u.observation)c.observation=u.observation;
   if(u.after==='Completed'){
    if(prevStatus!=='Completed'||!c.completedDate)c.completedDate=v.date||'';
   }else c.completedDate='';
  }
 }
}

function pickerMarkup(){return `<section class="component-setup"><div class="sectionactions"><div><h3>Applicable ECC Components</h3><p class="mutednote">Tick only components that apply to this landfill. For applicable items, choose whether construction is required by its ECC. You can add a project-specific component below.</p></div><span class="pickcount" id="pickCount">${countPicked()} selected</span></div><div class="picker-toolbar"><input type="search" id="pickerSearch" class="search" placeholder="Find a component (e.g. HDPE liner, leachate, Cell 1)" oninput="componentDraft.query=this.value;paintPicker()"><label class="tooltip-row" style="font-weight:600;white-space:nowrap;margin:0"><input type="checkbox" id="pickerOnly" onchange="componentDraft.onlySelected=this.checked;paintPicker()"> Show selected only</label></div><div class="picker-head"><div>Component / Facility</div><div>Applicable?</div><div>Required by ECC?</div><div>ECC Condition / Reference</div></div><div class="picker-scroll" id="pickerRows"></div><div class="customadd"><h3>Add a Component Not in the List</h3><div class="customaddgrid"><div class="field"><label for="newCompName">Component name</label><input id="newCompName" placeholder="e.g. Leachate Holding Tank"></div><div class="field"><label for="newCompGroup">Category</label><input id="newCompGroup" placeholder="e.g. Leachate Management" list="componentGroups"></div><div class="field"><label for="newCompRef">ECC reference (optional)</label><input id="newCompRef" placeholder="e.g. Annex C"></div><button class="btn" type="button" onclick="addCustomPickerItem()">+ Add</button></div><datalist id="componentGroups">${[...new Set(componentDraft.catalog.map(c=>c.group||'Other'))].map(g=>`<option value="${esc(g)}"></option>`).join('')}</datalist></div><p class="mutednote">Unselected items are excluded from the landfill checklist and progress metrics. Existing records are retained if a component is subsequently marked not applicable.</p></section>`}
function paintPicker(){

 choice[part]=part==='reference'?el.value:el.checked;
 if(part==='checked'){
  const row=el.closest('.picker-entry');row.querySelector('.pick-required').disabled=!el.checked;row.querySelector('.pickref').disabled=!el.checked;
  if(componentDraft.onlySelected)paintPicker();
 }
 const count=$('#pickCount');if(count)count.textContent=countPicked()+' selected';
}
function addCustomPickerItem(){
 const name=$('#newCompName').value.trim().replace(/\s+/g,' '),group=$('#newCompGroup').value.trim()||'Other',reference=$('#newCompRef').value.trim();
 if(!name){alert('Enter a component name.');return}
 if(name.length>120){alert('Component name must be 120 characters or fewer.');return}
 if(componentDraft.catalog.some(c=>normName(c.name)===normName(name))){alert('This component already exists. Search for it and tick Applicable.');return}
 componentDraft.catalog.push({name,group});
 componentDraft.selected[normName(name)]={checked:true,required:true,reference};
 componentDraft.query='';componentDraft.onlySelected=false;
 paintPicker();
 $('#newCompName').value='';$('#newCompRef').value='';
 $('#pickerRows').scrollTop=$('#pickerRows').scrollHeight;
}
function applyPicker(e){
 if(!componentDraft)return;
 for(const entry of componentDraft.catalog){
  const selection=ensureChoice(entry.name),key=normName(entry.name);
  let c=state.components.find(c=>c.ecc===e&&normName(c.name)===key);
  if(c){c.applicable=selection.checked;if(selection.checked){c.required=selection.required;c.reference=selection.reference;c.group=entry.group||c.group||'Other'}}
  else if(selection.checked){state.components.push({id:newLocalId('c-'),ecc:e,name:entry.name,group:entry.group||'Other',reference:selection.reference,required:selection.required,applicable:true,status:'Not Verified',completedDate:'',verifiedDate:'',observation:'',iis:'',verifier:'',remarks:''})}
 }
 const keys=new Set(state.catalog.map(c=>normName(c.name)));
 for(const entry of componentDraft.catalog)if(!keys.has(normName(entry.name))){state.catalog.push(entry);keys.add(normName(entry.name))}
 componentDraft=null;
}

// Date format: users enter/view MM/DD/YYYY; saved records retain ISO YYYY-MM-DD for accurate ordering.
function todayISO(){const d=new Date(),pad=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`}
function dateOut(value){const raw=String(value||'').trim();if(!raw)return '';
 const match=/^(\d{4})-(\d{2})-(\d{2})$/.exec(raw);
 return match?`${match[2]}/${match[3]}/${match[1]}`:raw;
}
function dateIn(value,label,required=false){const raw=String(value||'').trim();if(!raw){if(required)throw Error(label+' is required (MM/DD/YYYY).');return ''}
 const match=/^(\d{2})\/(\d{2})\/(\d{4})$/.exec(raw);
 if(!match)throw Error(label+': enter the date as MM/DD/YYYY (example: 06/04/2026).');
 const month=Number(match[1]),day=Number(match[2]),year=Number(match[3]);
 const parsed=new Date(Date.UTC(year,month-1,day));
 if(year<1900||year>2100||parsed.getUTCFullYear()!==year||parsed.getUTCMonth()!==month-1||parsed.getUTCDate()!==day)throw Error(label+': enter a valid calendar date in MM/DD/YYYY format.');
 return `${match[3]}-${match[1]}-${match[2]}`;
}

// The calendar control works offline using the browser's native date picker.
// The typed field retains the explicitly labeled MM/DD/YYYY format.
function calendarWidget(id,value='',inputClass=''){
 const iso=/^\d{4}-\d{2}-\d{2}$/.test(String(value||''))?String(value):'';
 return `<div class="date-entry">
  <input class="${esc(inputClass)}" id="${esc(id)}" name="${esc(id.startsWith('f_')?id.slice(2):id)}" type="text" inputmode="numeric" maxlength="10" placeholder="MM/DD/YYYY" value="${esc(dateOut(value))}" pattern="(0[1-9]|1[0-2])/(0[1-9]|[12][0-9]|3[01])/[0-9]{4}" title="Use MM/DD/YYYY or select a date on the calendar" autocomplete="off" oninput="dateTyped('${esc(id)}')">
  <span class="date-picker-button" title="Choose date from calendar">📅
   <input id="calendar_${esc(id)}" aria-label="Choose date from calendar" type="date" lang="en-US" value="${esc(iso)}" onclick="if(this.showPicker)try{this.showPicker()}catch(e){}" onchange="dateSelected('${esc(id)}',this.value)">
  </span></div>`;
}
function dateSelected(id,iso){
 const input=document.getElementById(id);
 if(input){input.value=dateOut(iso);input.dispatchEvent(new Event('input',{bubbles:true}));}

function dateTyped(id){
 const input=document.getElementById(id),calendar=document.getElementById('calendar_'+id);
 if(!input||!calendar)return;
 const raw=input.value.trim();
 if(!raw){calendar.value='';return;}
 try{calendar.value=dateIn(raw,'Date',true)}catch(err){calendar.value='';}
}
function setDateControl(id,iso){
 const input=document.getElementById(id),calendar=document.getElementById('calendar_'+id);

}

function monitoringTeam(v,style='initials'){

  return v.personnelIds.map(id=>{
   const p=personById(id),snap=(v.personnelSnapshot||[]).find(x=>x.id===id);

 }

function isPriorityPersonnel(p){
 const name=String(p?.name||'').normalize('NFKC').replace(/[.]/g,'').replace(/\s+/g,' ').trim().toLowerCase();
 return name==='mark anthony p solano';

function personnelOrder(a,b){

function latest(e){return visits(e)[0]}function cs(e){return state.components.filter(c=>c.ecc===e)}
function progress(e){let all=cs(e).filter(c=>componentApplies(c)&&c.required),done=all.filter(c=>c.status==='Completed');return {count:all.length,done:done.length,pct:all.length?Math.round(done.length/all.length*100):null}}

function pct(e){const p=progress(e);return p.pct===null?'Not assessed':`${p.pct}% (${p.done}/${p.count})`}
function gauge(e){const p=progress(e),n=cs(e).filter(componentApplies).length;return p.pct===null?`<span class="muted">${n?'No ECC-required components':'Checklist not configured'}</span>`:`<b>${p.pct}%</b><div class="progress"><div style="width:${p.pct}%"></div></div><span class="tiny">${p.done}/${p.count} ECC-required completed · ${n} applicable</span>`}

function regionalSummary(){
 const records=state.landfills.slice();
 const total=records.length, represented=new Set(records.map(l=>String(l.province||'').trim()).filter(Boolean)).size;
 const monitored=records.filter(l=>!!latest(l.ecc)).length;
 const without=total-monitored;
 const stageCounts=new Map();
 for(const l of records){
  const v=latest(l.ecc),name=(v?.stage||l.stage||'').trim()||'Not recorded';
  stageCounts.set(name,(stageCounts.get(name)||0)+1);
 }
 const ordered=[...stageCounts].sort((a,b)=>(a[0]==='Not recorded')-(b[0]==='Not recorded')||b[1]-a[1]||a[0].localeCompare(b[0]));
 const chart=ordered.map(([name,count])=>`<div class="stage-line"><span class="stage-label" title="${esc(name)}">${esc(name)}</span><div class="regional-track ${name==='Not recorded'?'unknown':''}" role="img" aria-label="${esc(name)}: ${count} of ${total} projects"><div style="width:${total?100*count/total:0}%"></div></div><span class="stage-num">${count} / ${total}</span></div>`).join('')||'<div class="regional-empty">No registered landfills</div>';
 const summaryStatus=['Completed','Ongoing','Not Started','Not Verified'];
 const colors={'Completed':'#2e9b77','Ongoing':'#dfa74a','Not Started':'#9aa9b8','Not Verified':'#a86e89'};
 const assessed=records.filter(l=>latest(l.ecc));
 const included=assessed.flatMap(l=>cs(l.ecc).filter(componentApplies));
 const sc=Object.fromEntries(summaryStatus.map(t=>[t,included.filter(c=>c.status===t).length]));
 const other=included.length-summaryStatus.reduce((n,t)=>n+sc[t],0);
 if(other)sc['Not Verified']+=other;
 const stack=included.length?summaryStatus.map(t=>`<div class="comp-segment" title="${esc(t)}: ${sc[t]}" style="width:${100*sc[t]/included.length}%;background:${colors[t]}"></div>`).join(''):'<div class="comp-segment" style="width:100%;background:#e4ebf2"></div>';
 const legend=summaryStatus.map(t=>`<span><span class="key-dot" style="background:${colors[t]}"></span><b>${sc[t]}</b> ${t}</span>`).join('');
 const sorted=records.sort((a,b)=>Number(!!latest(b.ecc))-Number(!!latest(a.ecc))||String(a.province||'').localeCompare(String(b.province||''))||String(a.lgu||'').localeCompare(String(b.lgu||'')));
 const rows=sorted.map(l=>{
  const v=latest(l.ecc),components=cs(l.ecc).filter(componentApplies),counts=Object.fromEntries(summaryStatus.map(s=>[s,components.filter(c=>c.status===s).length]));
  const comp=v?(components.length?`${counts.Completed} complete · ${counts.Ongoing} ongoing<div class="tiny">${counts['Not Started']} not started · ${components.length} applicable</div>`:'Checklist not configured'):'No visit on record';
  const finding=v?(v.findings?.trim()||'No findings encoded'):'No monitoring record available';
  const stage=v?.stage||l.stage||'Not recorded';
  return `<tr><td><button class="link" onclick="openProfile('${esc(l.ecc)}')">${show(l.lgu)}</button><div class="tiny">${show(l.province)}</div></td><td>${show(l.ecc)}</td><td>${v?esc(dateOut(v.date)):'No visit'}</td><td><span class="row-stage">${esc(stage)}</span></td><td>${comp}</td><td><div class="regional-find" title="${esc(finding)}">${esc(finding)}</div></td></tr>`;
 }).join('');
 const snapshot=dateOut(todayISO());
 $('#regionalSummaryMount').innerHTML=`<section class="regional-shell">${agencyBanner()}${head('SLF Construction Status Summary','Consolidated status of registered sanitary landfill projects across CAR.',`<button type="button" class="btn no-print" onclick="printRegionalSummary()">Print / Save as PDF</button>`)}<div class="regional-snap">Database snapshot: ${esc(snapshot)} (MM/DD/YYYY) · Latest saved monitoring records</div>
  <div class="regional-kpis">
   <div class="regional-kpi"><div class="k">Registered projects</div><div class="big">${total}</div><small>ECC-linked landfill records</small></div>
   <div class="regional-kpi"><div class="k">Provinces represented</div><div class="big">${represented}</div><small>With registered SLF projects</small></div>
   <div class="regional-kpi"><div class="k">Projects with visits</div><div class="big">${monitored}</div><small>At least one saved monitoring visit</small></div>
   <div class="regional-kpi"><div class="k">No monitoring visit</div><div class="big">${without}</div><small>Not classified as inactive</small></div>
  </div>
  <div class="regional-panels">
   <div class="regional-panel"><h2>Construction Stage Distribution</h2><p class="muted">Latest stage entered per landfill; missing stages are shown separately.</p>${chart}</div>
   <div class="regional-panel"><h2>Applicable Component Status</h2><p class="muted">${included.length} components across ${assessed.length} project(s) with monitoring history. Not a measure of physical construction accomplishment.</p><div class="component-stack" role="img" aria-label="Component status distribution">${stack}</div><div class="component-legend">${legend}</div>${!included.length?'<p class="tiny">No component status data available for monitored projects.</p>':''}</div>
  </div>
  <div class="regional-table-panel"><div class="detailtitle"><h2>Landfill Status at a Glance (${total})</h2><span class="tiny">Latest encoded data · Dates: MM/DD/YYYY</span></div><div class="tablewrap"><table class="regional-table"><colgroup><col style="width:16%"><col style="width:21%"><col style="width:12%"><col style="width:16%"><col style="width:18%"><col style="width:17%"></colgroup><thead><tr><th>LGU / Province</th><th>ECC Number</th><th>Latest Monitoring</th><th>Recorded Stage</th><th>Component Status</th><th>Latest Findings / Data Gap</th></tr></thead><tbody>${rows||'<tr><td colspan="6" class="regional-empty">No landfills registered.</td></tr>'}</tbody></table></div></div>
  <div class="regional-note">Source: Landfill Registry, component checklists, and monitoring records saved in this browser. This summary reflects the <strong>latest encoded information</strong>, which may not represent current site conditions. A component count is not a construction accomplishment percentage. Refer to the monitoring team's official reports for detailed findings.</div>
 </section>`;

function paintRegistry(){const ls=state.landfills.filter(l=>[l.ecc,l.lgu,l.municipality,l.province].join(' ').toLowerCase().includes(term.toLowerCase())).sort((a,b)=>{
 const provinceA=String(a.province||'').trim(),provinceB=String(b.province||'').trim();
 // Missing provinces appear last, followed by LGU A–Z for those records.
 if(!provinceA&&provinceB)return 1;
 if(provinceA&&!provinceB)return -1;
 const byProvince=provinceA.localeCompare(provinceB,undefined,{sensitivity:'base',numeric:true});
 if(byProvince)return byProvince;
 const byLgu=String(a.lgu||'').trim().localeCompare(String(b.lgu||'').trim(),undefined,{sensitivity:'base',numeric:true});
 return byLgu||String(a.ecc||'').localeCompare(String(b.ecc||''),undefined,{sensitivity:'base',numeric:true});

function addOrUpdatePerson(name,initials,id=''){
 name=String(name||'').trim().replace(/\s+/g,' ');
 initials=String(initials||'').trim().toUpperCase();
 if(name.length<2||name.length>100){alert('Enter a full name (2–100 characters).');return null}
 if(!/^[A-Z0-9.\-]{1,12}$/.test(initials)){alert('Initials must contain 1–12 letters, digits, periods, or hyphens, without spaces.');return null}
 if(state.personnel.some(p=>p.id!==id&&normName(p.name)===normName(name))){alert('This full name is already in the directory.');return null}
 if(state.personnel.some(p=>p.id!==id&&p.initials===initials)){alert('These initials are already assigned to another person. Use distinct initials to avoid confusion.');return null}
 const p=id?personById(id):{id:newLocalId('p-'),active:true};
 if(!p)return null;
 const before=JSON.stringify(state);
 if(!id)state.personnel.push(p);
 p.name=name;p.initials=initials;
 // Keep prior visits linked to the same personnel record even after a typo correction.
 for(const v of state.visits){
  if(!(v.personnelIds||[]).includes(p.id))continue;
  v.personnelSnapshot=(v.personnelIds||[]).map(pid=>{
   const x=personById(pid)||(v.personnelSnapshot||[]).find(q=>q.id===pid);
   return x?{id:pid,name:x.name,initials:x.initials}:null;
  }).filter(Boolean);
  v.team=monitoringTeam(v);
 }
 for(const e of new Set(state.visits.filter(v=>(v.personnelIds||[]).includes(p.id)).map(v=>v.ecc)))rebuildComponentStatuses(e);
 try{persist()}catch(err){state=JSON.parse(before);alert('Personnel changes could not be saved: '+err.message);return null}
 return p;
}

function photoDatabase(){return new Promise((resolve,reject)=>{

 try{const req=operate(store);if(req){req.onsuccess=()=>result=req.result;req.onerror=()=>reject(req.error||Error('Photo transaction failed'))}}catch(e){db.close();reject(e);return}

 if(picked.length>15){statusEl.textContent='Choose up to 15 photographs at a time. You can upload another batch afterwards.';statusEl.classList.add('error');return}
 photoUploading=true;statusEl.classList.remove('error');statusEl.textContent=`Saving ${picked.length} photo(s)… Please keep this window open.`;zone.classList.add('uploading');
 try{const count=await addSitePhotos(picked,{ecc:e,visitId,date,caption,iis:v?.iis||''});if(view==='profile'&&selected===e)profile();
  if($('#photoUploadStatus')){$('#photoUploadStatus').textContent=`✓ ${count} photograph(s) saved. To add more, choose another batch.`;$('#photoUploadStatus').classList.remove('error')}
  // Refresh gallery without clearing the upload fields or the saved-success message.
  const gallery=$('#photoDropzone')?.parentElement?.querySelector('.photo-grid');
  const heading=$('#photoDropzone')?.parentElement?.querySelector('.photo-gallery-head h3');
  if(gallery){gallery.innerHTML=photosFor(e).map(p=>photoCard(p,true)).join('');hydratePhotoImages()}
  if(heading)heading.textContent=`Photos on File (${photosFor(e).length})`;
 }catch(err){if($('#photoUploadStatus')){$('#photoUploadStatus').textContent='Upload failed: '+err.message;$('#photoUploadStatus').classList.add('error')}}
 finally{photoUploading=false;if($('#photoDropzone'))$('#photoDropzone').classList.remove('uploading')}
}
function removeSitePhoto(id){const photo=state.photos.find(p=>p.id===id);if(!photo)return;if(!confirm('Remove this actual site photograph from the gallery and backup database?'))return;
 const prior=state.photos.slice();state.photos=state.photos.filter(p=>p.id!==id);try{persist()}catch(e){state.photos=prior;return alert('Deletion failed: '+e.message)}
 deletePhotoBytes(id).catch(()=>alert('Image bytes could not be deleted; please try again later.'));if(view==='profile'&&selected===photo.ecc)profile();openPhotoManager(photo.ecc);
}
function editPhotoInfo(id){
 const p=state.photos.find(x=>x.id===id);if(!p)return;
 modal(`<div class="modalhead"><h2>Edit Site Photograph</h2><button class="close" onclick="closeModal()" aria-label="Close">×</button></div>
  <form onsubmit="saveEditedPhoto(event,'${esc(id)}')">
   <div class="field"><label for="photoEditCaption">Description</label><input id="photoEditCaption" maxlength="160" value="${esc(p.caption||'')}"></div>
   <div class="field" style="margin-top:16px"><label for="photoEditDate">Date photograph was taken (MM/DD/YYYY)</label>${calendarWidget('photoEditDate',p.date)}<div class="tiny date-help">MM/DD/YYYY · Select from calendar or type a date</div></div>
   <div class="actions" style="margin-top:24px"><button type="button" class="btn" onclick="openPhotoManager('${esc(p.ecc)}')">Cancel</button><button type="submit" class="btn primary">Save Photo Details</button></div>
  </form>`);
}
function saveEditedPhoto(ev,id){
 ev.preventDefault();const p=state.photos.find(x=>x.id===id);if(!p)return;
 let isoDate;try{isoDate=dateIn(document.getElementById('photoEditDate').value,'Date photograph was taken',true)}catch(err){return alert(err.message)}
 const old={...p};p.caption=document.getElementById('photoEditCaption').value.trim().slice(0,160);p.date=isoDate;
 try{persist()}catch(err){Object.assign(p,old);return alert(err.message)}
 if(view==='profile'&&selected===p.ecc)profile();openPhotoManager(p.ecc);
}

async function openPhotoPreview(id){const p=state.photos.find(x=>x.id===id);if(!p)return;try{const bytes=await getPhotoBytes(id);if(!bytes)return alert('Image unavailable. Restore from a full backup.');
 const overlay=document.createElement('div');overlay.className='modalbg';overlay.style.zIndex='50';overlay.style.display='grid';overlay.style.placeItems='center';overlay.onclick=ev=>{if(ev.target===overlay)overlay.remove()};
 const card=document.createElement('div');card.style.cssText='background:white;border-radius:14px;padding:14px;max-width:min(96vw,1050px);max-height:95vh;overflow:auto';
 const header=document.createElement('div');header.style.cssText='display:flex;justify-content:space-between;align-items:center;gap:15px';
 const label=document.createElement('strong');label.textContent=(p.caption||'Site condition')+' · '+(dateOut(p.date)||'Undated');header.append(label);
 const close=document.createElement('button');close.className='btn';close.textContent='Close';close.onclick=()=>overlay.remove();header.append(close);card.append(header);
 const img=document.createElement('img');img.src=bytes;img.alt=p.caption||'Site photo';img.style.cssText='max-width:100%;max-height:78vh;margin-top:12px;border-radius:8px;object-fit:contain;display:block';card.append(img);overlay.append(card);document.body.append(overlay);
 }catch(err){alert('Photo could not be opened: '+err.message)}
}


// A ChatGPT attachment preview or locked-down browser may block local storage.
// In that case show a clearly marked non-saving preview rather than a blank page.
let startupStorageError=null;
try{persist()}catch(err){startupStorageError=err}
render();
if(startupStorageError){
 const warning=document.createElement('aside');
 warning.id='storage-access-warning';
 warning.setAttribute('role','alert');
 warning.style.cssText='position:sticky;top:0;z-index:9999;background:#fff2cf;color:#50380c;border-bottom:2px solid #c58a25;padding:14px 24px;font:600 14px/1.5 Segoe UI,Arial,sans-serif';
 warning.textContent='Preview only — this browser has blocked local database storage, so updates cannot be saved here. Download the HTML or ZIP file to your computer and open the extracted HTML in Chrome or Edge before entering records.';
 document.body.prepend(warning);
}
</script></body></html>
